# Ganglion 2.x configuration. Copy to ~/.config/ganglion/config.toml and edit.
# Paths accept ~ and $VAR. A Ganglion 1.x file ([ganglion] table, see config.v1.example.toml)
# is still accepted and runs in single-machine mode.
#
# The same file format serves three roles; each machine only needs the sections it uses:
#   single Mac (default) : [worker] control_plane = "local" + [inbox] + [repos] + [notify]
#   control plane host   : [control] + [notify]                   -> ganglion server start
#   worker machine       : [worker] control_plane = "https://..." + [claude] + [repos]

[worker]
# Logical worker name (unique per machine). Defaults to the short hostname.
id = "macbook-m1-01"

# "local" = embed the control plane (SQLite in state_dir; no server, no PostgreSQL).
# Or the URL of a shared control plane, e.g. "https://ganglion.internal:8700".
control_plane = "local"

# Bearer token for a remote control plane. Keep it out of git; the env var
# GANGLION_API_TOKEN overrides this file.
# token_file = "~/.config/ganglion/token"

# Worker-local state: worker.json (attempts this machine runs, pending reports),
# events.jsonl (local diagnostics), results/, locks. Exported to sessions as GANGLION_STATE.
state_dir = "~/.ganglion"

# Per-attempt workspaces (worktrees / clones) and the clone cache for repository URLs.
workspace_root = "~/.ganglion/workspaces"

# Seconds between loop iterations (claims, inbox polls). Heartbeats follow the control
# plane's advice unless heartbeat_interval is set here.
poll_interval = 10
# heartbeat_interval = 30

# How many attempts this worker runs at once.
max_concurrent = 4

# Jobs on a [repos] checkout: "worktree" gives every attempt its own git worktree and
# branch ganglion/<job>-<attempt> (default); "shared" runs in the checkout itself, one
# attempt at a time (the 1.x layout).
isolation = "worktree"

# "branch": push the attempt's branch to origin when it finishes, so the result outlives
# this machine (the pushed branch becomes the result_uri). "none": keep it local.
publish = "none"

# A session that exits without a result fails the attempt. true = retryable (another
# attempt may be scheduled while the job's max_attempts allows); false = job fails.
retry_on_launcher_exit = false

# What to do with a local session whose attempt the control plane gave to someone else:
# "keep" (default; leave it for inspection, never report it) or "stop" (kill it).
stale_policy = "keep"

# target: new -> gh repo create <owner>/<repo> --private, cloned to <new_repo_root>/<repo>.
new_repo_root = "~/code"

# The job goal is written to <workspace>/<req_path>/<job name>.md and committed alone.
req_path = "docs/requirements"

# Initial input for `claude '<prompt>'`; {id} = job name, {req_path} as above.
# Agent Spine 1.x does not produce a completion artifact, so the prompt asks for DELIVERY.md.
launch_prompt = "/spine-run --auto 需求 {id}：详见 {req_path}/{id}.md（先完整阅读该文件）。全部完成后，在工程根目录写 DELIVERY.md 作为交付报告（前 20 行写结论摘要）。"

# How the Agent Spine result is recognised: "auto" (structured $GANGLION_RESULT_FILE if
# written, else DELIVERY.md), "1" (DELIVERY.md only), "2" (structured only).
spine_protocol = "auto"

# Launcher. Only "claude-code" (interactive Claude Code in tmux) exists today.
launcher = "claude-code"

[claude]
# Under launchd PATH is short: use the absolute path from `which claude`.
claude_cmd = "claude"
# Extra args between claude and the prompt, e.g. "--permission-mode acceptEdits".
claude_args = ""
claude_json = "~/.claude.json"
# Watch the pane this many seconds after start; press Enter once on a trust prompt.
trust_wait = 8
# tmux -L socket; empty = default server (`tmux -CC attach -t gl-...` works directly).
tmux_socket = ""

# Repository name -> local checkout on THIS machine. Names are the global identity jobs
# use; paths never leave the worker. Workers advertise the names they map, and a job
# without a repository URL is only given to a worker that maps its name.
[repos]
# my-app = "~/code/my-app"

# Git inbox job source: <id>.md files -> jobs (key "inbox:<id>", idempotent).
# Enable it on ONE machine (running it twice is harmless, just redundant).
[inbox]
dir = "~/ganglion-inbox"
git_pull = true
# owner for target: new
owner = "your-github-name"

[control]
# Control plane settings: used by `ganglion server start`, and by the embedded control
# plane in local mode. Production: PostgreSQL.
# database = "postgresql://ganglion:***@db.internal/ganglion"
# database = "sqlite:///~/.ganglion/control.db"      # default in local mode
listen = "127.0.0.1"
port = 8700
# The token the server accepts (file outside git; GANGLION_API_TOKEN overrides).
# token_file = "/etc/ganglion/token"
lease_ttl = 300            # seconds an attempt stays authoritative without a heartbeat
heartbeat_interval = 30    # advised to workers
max_depth = 2              # recursion protection for source: agent jobs
max_attempts = 3           # lease expiries + retryable failures before a job fails
worker_offline_after = 120 # observability only

[notify]
# ntfy (default) | file | null | "python.module:factory"
backend = "ntfy"
ntfy_server = "https://ntfy.sh"
# On public ntfy.sh the topic is the password: use a long random string.
ntfy_topic = "ganglion-change-me-to-something-random"
ntfy_token = ""
ntfy_priority = 3
file_path = "~/.ganglion/notifications.jsonl"
